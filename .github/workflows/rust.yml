name: Sovereign Lattice CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Engine
      run: cargo build --verbose
      working-directory: ./rust_engine

    - name: Run Tests
      run: cargo test --verbose
      working-directory: ./rust_engine

    - name: Produce CXP local PBFT quorum artifact
      run: |
        mkdir -p ../artifacts
        cargo run --quiet --bin cxp_finalizer -- 8fe0c9456f4c9a64f47aa0e265d3e18972128f7979dc251ac4decdab1ba19dde > ../artifacts/sovereign-cxp-local-quorum.json
      working-directory: ./rust_engine

    - name: Upload CXP local PBFT quorum artifact
      uses: actions/upload-artifact@v4
      with:
        name: sovereign-cxp-local-quorum
        path: artifacts/sovereign-cxp-local-quorum.json
