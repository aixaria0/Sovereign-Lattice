name: Sovereign-Lattice Cluster Smoke Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  e2e-consensus-test:
    name: Run 4-Node PBFT Cluster
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./rust_engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache (For faster builds)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./rust_engine

      - name: Make smoke test executable
        run: chmod +x scripts/smoke_test.sh

      - name: Execute 4-process CXP PBFT finality test
        env:
          CXP_DIGEST: 8fe0c9456f4c9a64f47aa0e265d3e18972128f7979dc251ac4decdab1ba19dde
        run: ./scripts/smoke_test.sh

      - name: Upload cluster finality artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-cxp-cluster-finality
          path: rust_engine/artifacts/sovereign-cxp-cluster-finality.json
